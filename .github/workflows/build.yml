name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk android-sdk-platform-23 dalvik-exchange

      - name: Build debug APK
        run: ./build.sh && cp build/water-glass-debug.apk water-glass.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-glass-apk
          path: water-glass.apk

      # On every build of main, replace the "latest" release so the newest
      # APK is always at the same download link.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest water-glass.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap water-glass.apk to download."

      # Preview release for this branch, so the APK can be downloaded on the
      # phone before the pull request is merged.
      - name: Publish branch preview release
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" water-glass.apk --prerelease --target "$GITHUB_SHA" \
            --title "Preview: $GITHUB_REF_NAME" \
            --notes "Test build from branch $GITHUB_REF_NAME (${GITHUB_SHA::7})."
